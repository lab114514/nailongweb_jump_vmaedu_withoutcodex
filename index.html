<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奶龙书院</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="nailong-icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="nailong-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="nailong-touch-icon.png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; }
  </style>
</head>
<body>
  <video id="intro" src="intro.mp4" poster="poster.jpg" autoplay playsinline preload="auto" aria-label="点击播放视频"></video>
  <script>
    const video = document.getElementById('intro');
    const play = () => {
      if (!video.ended) video.play().catch(() => {});
    };
    video.addEventListener('ended', () => {
      window.location.replace('https://www.vma.edu.cn/');
    });
    document.addEventListener('click', play);
    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space' || event.code === 'Enter') {
        event.preventDefault();
        play();
      }
    });
    play();
  </script>
</body>
</html>
